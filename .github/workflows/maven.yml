# .github/workflows/ci.yml

name: Java CI with Maven

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Validate Flyway migrations (immutable, unique, well named)
        run: scripts/check-migrations.sh "origin/${{ github.base_ref || 'main' }}"

      - name: Test scripts (migration guard and blue/green deploy)
        run: |
          scripts/tests/check_migrations_test.sh
          deploy/tests/deploy_test.sh
          deploy/tests/backup_test.sh

      # `verify` roda o spotless:check, os testes (que migram um Postgres limpo e validam o schema
      # com ddl-auto=validate) e o JaCoCo.
      - name: Build and run tests
        run: ./mvnw --batch-mode --update-snapshots clean verify

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

  docker-image:
    name: Build container image
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

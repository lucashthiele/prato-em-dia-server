# Deploy em produção: roda depois do CI verde em main. Nenhum segredo vive no repositório;
# tudo vem dos secrets/variáveis do ambiente `production` (ver docs/trabalho-manual/w4-infra.md).
name: Deploy

on:
  workflow_run:
    workflows: ["Java CI with Maven"]
    branches: ["main"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/prato-em-dia-server

jobs:
  image:
    name: Publish image to GHCR
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Resolve commit SHA
        id: sha
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.sha }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.sha.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Blue/green deploy over SSH
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.image.outputs.sha }}

      - name: Read release manifest
        id: release
        run: |
          api_sha="$(awk '/^api:/{f=1;next} f&&/sha:/{gsub(/[" ]/,"",$2);print $2;exit}' deploy/release.yaml)"
          portal_sha="$(awk '/^portal:/{f=1;next} f&&/sha:/{gsub(/[" ]/,"",$2);print $2;exit}' deploy/release.yaml)"
          [ "$api_sha" = "head" ] && api_sha="${{ needs.image.outputs.sha }}"
          case "$portal_sha" in REPLACE_*|"") echo "portal.sha não preenchido em deploy/release.yaml" >&2; exit 1 ;; esac
          echo "api_sha=$api_sha" >> "$GITHUB_OUTPUT"
          echo "portal_sha=$portal_sha" >> "$GITHUB_OUTPUT"

      - name: Download portal build
        env:
          GH_TOKEN: ${{ secrets.PORTAL_REPO_TOKEN }}
        run: |
          gh release download "${{ steps.release.outputs.portal_sha }}" \
            --repo "${{ vars.PORTAL_REPO }}" --pattern "portal-*.tar.gz" --output portal.tar.gz

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Sync deploy files and portal archive
        run: |
          ssh_opts="-i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes"
          target="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          rsync -e "ssh $ssh_opts" -a deploy/compose.yaml deploy/Caddyfile deploy/scripts/ "$target:/srv/prato/"
          rsync -e "ssh $ssh_opts" -a --delete deploy/backup/ "$target:/srv/prato/backup/"
          rsync -e "ssh $ssh_opts" -a --delete deploy/observability/ "$target:/srv/prato/observability/"
          scp $ssh_opts portal.tar.gz "$target:/srv/prato/portal.tar.gz"

      - name: Run deploy script
        run: |
          # Uma linha só: o gate do SSH (deploy/vps/ssh-gate.sh) valida o comando por regex.
          cmd="REGISTRY_IMAGE=${{ env.IMAGE }} PORTAL_ARCHIVE=/srv/prato/portal.tar.gz /srv/prato/deploy.sh --api-sha ${{ steps.release.outputs.api_sha }} --portal-sha ${{ steps.release.outputs.portal_sha }}"
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "$cmd"

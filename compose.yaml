services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=pratoemdia'
      - 'POSTGRES_PASSWORD=postgres'
      - 'POSTGRES_USER=postgres'
    ports:
      - '5432:5432'
  mailpit:
    image: 'axllent/mailpit:latest'
    ports:
      - '1025:1025'
      - '8025:8025'

spring:
  application:
    name: server
  config:
    import: optional:file:./local.env[.properties]
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
server:
  error:
    include-binding-errors: never
    include-exception: false
    include-message: never
    include-stacktrace: never
logging:
  level:
    org.springframework.security: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  paths-to-match: /api/**
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true

security:
  jwt:
    issuer: ${JWT_ISSUER:prato-em-dia}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P30D}
    secret: ${JWT_SECRET}

relationships:
  mail:
    from: ${MAIL_FROM:no-reply@pratoemdia.local}
    app-url: ${APP_URL:http://localhost:3000}

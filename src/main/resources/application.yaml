spring:
  application:
    name: server
  config:
    import: optional:file:./local.env[.properties]
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    validate-on-migrate: true
management:
  server:
    # Porta própria e nunca publicada: só a rede do Compose enxerga (docs/infraestrutura.md).
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
server:
  error:
    include-binding-errors: never
    include-exception: false
    include-message: never
    include-stacktrace: never
logging:
  level:
    org.springframework.security: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  paths-to-match: /api/**
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true

security:
  jwt:
    issuer: ${JWT_ISSUER:prato-em-dia}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P30D}
    secret: ${JWT_SECRET}

relationships:
  mail:
    resend-api-key: ${RESEND_API_KEY}
    from: ${MAIL_FROM:onboarding@resend.dev}
    app-url: ${APP_URL:http://localhost:3000}

spring:
  application:
    name: server
  config:
    import: optional:file:./local.env[.properties]
server:
  # Behind Caddy (the only published service) the client IP comes from X-Forwarded-For.
  forward-headers-strategy: native
  error:
    include-binding-errors: never
    include-exception: false
    include-message: never
    include-stacktrace: never
logging:
  level:
    org.springframework.security: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  paths-to-match: /api/**
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true

security:
  jwt:
    issuer: ${JWT_ISSUER:prato-em-dia}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P30D}
    secret: ${JWT_SECRET}
  login-rate-limit:
    enabled: ${LOGIN_RATE_LIMIT_ENABLED:true}
    max-attempts-per-email: ${LOGIN_RATE_LIMIT_MAX_PER_EMAIL:5}
    max-attempts-per-ip: ${LOGIN_RATE_LIMIT_MAX_PER_IP:30}
    window: ${LOGIN_RATE_LIMIT_WINDOW:PT15M}
  session:
    # Secure cookies are not resent over plain HTTP; turn off only for local development.
    secure: ${SESSION_COOKIE_SECURE:true}
    # Origins allowed to perform state-changing requests (CSRF check, ADR 0001).
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173,http://localhost:3000}

client:
  # Minimum X-Client-Version per platform (header format "<platform>/<version>"); older clients get 426 CLIENT_OUTDATED.
  min-versions:
    web: ${CLIENT_MIN_VERSION_WEB:0.0.0}
    android: ${CLIENT_MIN_VERSION_ANDROID:0.0.0}
    ios: ${CLIENT_MIN_VERSION_IOS:0.0.0}

consent:
  enforced: ${CONSENT_ENFORCED:true}
  # Current version of each legal document. Bumping a version asks every patient and nutritionist to accept again.
  # PLACEHOLDER: set the real versions when the legal texts are approved (docs/trabalho-manual/w3-acesso-admin.md).
  current-versions:
    TERMS_OF_USE: ${CONSENT_TERMS_VERSION:placeholder-1}
    PRIVACY_POLICY: ${CONSENT_PRIVACY_VERSION:placeholder-1}

relationships:
  mail:
    resend-api-key: ${RESEND_API_KEY}
    from: ${MAIL_FROM:onboarding@resend.dev}
    app-url: ${APP_URL:http://localhost:3000}
